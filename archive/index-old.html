<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="any">
<title>气球大乱踩</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100dvh; /* dvh 适配移动端浏览器地址栏 */
  height: 100vh;  /* fallback */
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  position: fixed;
  --ctrl-h: 140px; /* 控制栏高度变量，横屏会覆盖 */
}
#game-wrap {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #0a0a2e;
}
#hud {
  position: absolute;
  top: 8px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 20px;
  font: bold 14px monospace;
  color: #fff;
  z-index: 10;
  pointer-events: none;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
}
#hud span { min-width: 60px; text-align: center; }

/* ── 控制栏 ── */
#controls {
  flex-shrink: 0;
  width: 100%;
  height: var(--ctrl-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, #111 0%, #0a0a0a 100%);
  border-top: 1px solid #333;
}
/* 左侧：方向键 */
#dpad {
  display: flex;
  gap: 10px;
}
.dpad-btn {
  width: 70px;
  height: 70px;
  border-radius: 16px;
  border: 2px solid #555;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font: bold 28px sans-serif;
  color: #bbb;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  transition: background 0.05s;
}
.dpad-btn.active {
  background: rgba(255,255,255,0.25);
  border-color: #8af;
  color: #fff;
}
/* 中间：信息 */
#info-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
#info-panel .balloon-display {
  font-size: 22px;
}
#info-panel .score-display {
  font: bold 16px monospace;
  color: #ff6;
  text-shadow: 0 0 8px rgba(255,255,100,0.3);
}
#info-panel .reset-btn {
  pointer-events: auto;
  font: 11px monospace;
  color: #888;
  background: rgba(255,255,255,0.06);
  border: 1px solid #444;
  border-radius: 8px;
  padding: 4px 12px;
  cursor: pointer;
}
#info-panel .reset-btn:active {
  background: rgba(255,255,255,0.15);
}
/* 右侧：拍打按钮 */
#flap-btn {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid #5a8;
  background: radial-gradient(circle at 40% 35%, rgba(100,255,180,0.25) 0%, rgba(60,180,120,0.15) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font: bold 22px monospace;
  color: #8e8;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  transition: transform 0.06s, background 0.06s;
  box-shadow: 0 0 20px rgba(80,200,140,0.15);
}
#flap-btn.active {
  transform: scale(0.92);
  background: radial-gradient(circle at 40% 35%, rgba(150,255,200,0.4) 0%, rgba(80,220,150,0.3) 100%);
  border-color: #8e8;
  color: #fff;
}
#flap-btn .emoji { font-size: 32px; line-height: 1; }

/* 重生遮罩 */
#respawn-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: var(--ctrl-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  pointer-events: none;
}
#respawn-countdown {
  font: bold 72px monospace;
  color: #ff6;
  text-shadow: 0 0 20px rgba(255,255,0,0.5);
  animation: pulse 1s ease-in-out;
}
#respawn-text {
  font: bold 16px monospace;
  color: #fff;
  margin-top: 12px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}
@keyframes pulse {
  0% { transform: scale(1.5); opacity: 0; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
/* ── 横屏：左右分栏布局 ── */
@media (orientation: landscape) {
  :root, html, body { --ctrl-h: 80px; }

  #game-wrap {
    flex-direction: row; /* canvas 左，controls 右 */
  }

  /* canvas 父容器占满左侧 */
  #game-wrap > div:first-child {
    flex: 1;
    min-width: 0;
    height: 100%;
  }

  canvas {
    /* 尺寸由 JS resize() 控制，此处不覆盖 */
    flex: none;
  }

  /* 控制栏竖排在右侧 */
  #controls {
    width: 140px;
    height: 100%;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 12px 8px;
    padding-right: max(8px, env(safe-area-inset-right));
    border-top: none;
    border-left: 1px solid #333;
    background: linear-gradient(to right, #111 0%, #0a0a0a 100%);
  }

  #dpad {
    flex-direction: column;
    gap: 8px;
  }
  .dpad-btn {
    width: 56px;
    height: 56px;
    font-size: 22px;
    border-radius: 12px;
  }

  #flap-btn {
    width: 90px;
    height: 90px;
    font-size: 18px;
  }
  #flap-btn .emoji { font-size: 24px; }

  /* 重生遮罩覆盖 canvas 区域（右侧不遮盖） */
  #respawn-overlay {
    bottom: 0;
    right: 140px; /* 不覆盖右侧控制栏 */
  }
}
</style>
</head>
<body>
<div id="game-wrap">
  <div style="position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;">
    <div id="hud">
      <span id="hudBalloon">🎈🎈</span>
      <span id="hudState">浮空</span>
      <span id="hudScore">0 分</span>
      <span id="hudDeaths" style="color:#8f8">❤️ 10</span>
    </div>
    <div id="respawn-overlay" style="display:none">
      <div id="respawn-countdown">3</div>
      <div id="respawn-text">被击败了！即将重生...</div>
    </div>
    <canvas id="game"></canvas>
  </div>
  <div id="controls">
    <div id="dpad">
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
    </div>
    <div id="info-panel">
      <div class="balloon-display" id="balloon-icon">🎈🎈</div>
      <div class="score-display" id="score-text">0</div>
      <div class="reset-btn" id="btn-reset">🔄 重来</div>
    </div>
    <div id="flap-btn">
      <div class="emoji">👆</div>
      <div>拍打</div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 气球大乱踩 — 虚拟按键手机版（支持横屏分栏）
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- 逻辑分辨率（像素风）----------
const GAME_W = 480;
const GAME_H = 360;
let scale = 1;

function resize() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w === 0 || h === 0) return;
  // 保持 4:3 比例，居中适配（letterbox/pillarbox）
  scale = Math.min(w / GAME_W, h / GAME_H);
  canvas.width = Math.floor(GAME_W * scale);
  canvas.height = Math.floor(GAME_H * scale);
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', () => { resize(); });
// orientationchange 兼容部分移动端浏览器
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();

// ---------- 物理参数 ----------
const PHYS = {
  gravity2: 0.18,
  gravity1: 0.30,
  gravity0: 0.55,
  flapImpulse2: -2.5,
  flapImpulse1: -1.8,
  flapImpulse0: -0.8,
  terminalVel2: 2.2,
  terminalVel1: 4.0,
  terminalVel0: 9.0,
  airAccel: 0.30,
  airMaxSpeed: 2.5,
  airFriction: 0.93,
  groundAccel: 0.25,
  groundMaxSpeed: 2.0,
  groundFriction: 0.85,
  groundStartDelay: 3,
  flapCooldown: 18,
  rechargeTime: 1200,
  maxBalloons: 5,        // 最多持有 5 个气球
  maxRespawns: 10,       // 最多复活 10 次
};

// ---------- 输入状态 ----------
const input = {
  left: false,
  right: false,
  flap: false,
  flapJustPressed: false,
};

// ---------- 音效合成（Web Audio）----------
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  switch (type) {
    case 'flap':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(600, t + 0.05);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
      break;
    case 'pop':
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t); osc.stop(t + 0.2);
      break;
    case 'stomp':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.12);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t); osc.stop(t + 0.15);
      break;
    case 'land':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
      break;
    case 'splash':
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.05));
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.2, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      src.connect(g2); g2.connect(audioCtx.destination);
      src.start(t);
      return;
  }
}

// ---------- 粒子系统 ----------
const particles = [];

function spawnPopParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
    const speed = 1.5 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1.0,
      decay: 0.02 + Math.random() * 0.02,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

function spawnBounceParticles(x, y) {
  for (let i = 0; i < 5; i++) {
    const angle = -Math.PI * 0.3 - Math.random() * Math.PI * 0.4;
    const speed = 0.5 + Math.random() * 1.5;
    particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: 0.03 + Math.random() * 0.02,
      size: 1 + Math.random() * 2,
      color: '#fff',
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(
      (p.x - p.size / 2) * scale,
      (p.y - p.size / 2) * scale,
      p.size * scale,
      p.size * scale
    );
  }
  ctx.globalAlpha = 1;
}

// ---------- 平台定义 ----------
const platforms = [
  { x: 160, y: 290, w: 160, h: 12, color: '#4a8', isMain: true },
  { x: 60, y: 220, w: 80, h: 8, color: '#68a' },
  { x: 340, y: 220, w: 80, h: 8, color: '#68a' },
  { x: 190, y: 170, w: 100, h: 8, color: '#68a' },
  { x: 40, y: 140, w: 70, h: 8, color: '#68a' },
  { x: 370, y: 140, w: 70, h: 8, color: '#68a' },
];

const WATER_Y = 320;

// ---------- 玩家 ----------
const player = {
  x: 240, y: 150,
  vx: 0, vy: 0,
  w: 20, h: 24,
  balloons: 2,
  maxBalloons: 5,        // 最多 5 个气球
  onGround: false,
  alive: true,
  respawnsLeft: 10,      // 剩余复活次数
  rechargeTimer: 0,
  flapCooldown: 0,
  facing: 1,
  walkFrame: 0,
  flapFrame: 0,
  invincible: 0,
  _groundStartFrame: 0,
  score: 0,
  stompChain: 0,
  stompTimer: 0,
  deathCount: 0,
};

let respawnState = {
  active: false,
  timer: 0,
  tick: 0,
};

// ---------- 敌人 ----------
const enemies = [];

function spawnEnemy(x, y, color, aiLevel, scale) {
  const enemy = {
    x, y, vx: 0, vy: 0,
    w: Math.round(20 * (scale || 1)),
    h: Math.round(24 * (scale || 1)),
    scale: scale || 1,
    balloons: aiLevel >= 3 ? 3 : 2,
    maxBalloons: aiLevel >= 3 ? 3 : 2,
    alive: true,
    color: color,
    aiLevel: aiLevel,
    facing: Math.random() > 0.5 ? 1 : -1,
    flapTimer: 0,
    flapCooldown: 0,
    thinkTimer: 0,
    targetVx: 0,
    respawnTimer: 0,
    walkFrame: 0,
    flapFrame: 0,
    onGround: false,
    _groundStartFrame: 0,
    groundedZeroTimer: 0,
    inflatePhase: 0,      // 0=等待充气 1=正在充气
    inflateTimer: 0,      // 充气动画计时器
    invincible: 0,        // 无敌时间（防挤压连爆）
    weight: scale || 1,   // 重量，影响重力
  };
  enemies.push(enemy);
  return enemy;
}

function resetEnemies() {
  enemies.length = 0;

  // 红色暴躁：正中央上方，3气球，疯狂追击
  spawnEnemy(230, 30, '#f33', 3, 1);
  // 橙色：左侧区域，2气球
  spawnEnemy(60, 210, '#f84', 2, 1);
  // 绿巨人：右侧区域，3气球，大体型
  const green = spawnEnemy(350, 210, '#4a4', 1, 1.5);
  green.balloons = 3;
  green.maxBalloons = 3;
  // 蓝色：中间大平台上方，2气球
  spawnEnemy(240, 260, '#48f', 2, 1);
}

// ---------- 碰撞检测 ----------
function boxOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function platformCollision(entity) {
  entity.onGround = false;
  for (const plat of platforms) {
    if (entity.vy >= 0 &&
        entity.x + entity.w > plat.x && entity.x < plat.x + plat.w &&
        entity.y + entity.h >= plat.y && entity.y + entity.h <= plat.y + plat.h + 6) {
      entity.y = plat.y - entity.h;
      entity.vy = 0;
      entity.onGround = true;
      if (plat.isMain && entity === player && entity.balloons < 2) {
        entity.rechargeTimer += 16;
      }
    }
  }
}

function getGravity(balloons) {
  if (balloons >= 2) return PHYS.gravity2;
  if (balloons === 1) return PHYS.gravity1;
  return PHYS.gravity0;
}

function getFlapImpulse(balloons) {
  if (balloons >= 2) return PHYS.flapImpulse2;
  if (balloons === 1) return PHYS.flapImpulse1;
  return PHYS.flapImpulse0;
}

function getTerminalVel(balloons) {
  if (balloons >= 2) return PHYS.terminalVel2;
  if (balloons === 1) return PHYS.terminalVel1;
  return PHYS.terminalVel0;
}

// ---------- 屏幕震动 ----------
let screenShake = 0;
let screenShakeX = 0;
let screenShakeY = 0;

function addScreenShake(intensity) {
  screenShake = Math.max(screenShake, intensity);
}

function updateScreenShake() {
  if (screenShake > 0) {
    screenShakeX = (Math.random() - 0.5) * screenShake * 2;
    screenShakeY = (Math.random() - 0.5) * screenShake * 2;
    screenShake *= 0.85;
    if (screenShake < 0.5) { screenShake = 0; screenShakeX = 0; screenShakeY = 0; }
  }
}

// ---------- 物理更新 ----------
function updatePhysics(entity, dt) {
  if (entity.flapCooldown > 0) entity.flapCooldown--;

  const grav = getGravity(entity.balloons);
  entity.vy += grav;
  const term = getTerminalVel(entity.balloons);
  if (entity.vy > term) entity.vy = term;

  if (entity.onGround) {
    if (entity === player) {
      const wasMoving = Math.abs(entity.vx) > 0.1;
      const pressing = input.left || input.right;
      let accel = PHYS.groundAccel;
      if (!wasMoving && pressing) {
        accel = PHYS.groundAccel * 0.4;
        if (entity._groundStartFrame === undefined) entity._groundStartFrame = 0;
        entity._groundStartFrame++;
        if (entity._groundStartFrame < PHYS.groundStartDelay) {
          accel = PHYS.groundAccel * 0.2;
        } else {
          accel = PHYS.groundAccel * 0.6;
        }
      } else {
        entity._groundStartFrame = 0;
      }
      if (input.left) { entity.vx -= accel; entity.facing = -1; }
      if (input.right) { entity.vx += accel; entity.facing = 1; }
    }
    entity.vx *= PHYS.groundFriction;
    if (Math.abs(entity.vx) > PHYS.groundMaxSpeed) {
      entity.vx = Math.sign(entity.vx) * PHYS.groundMaxSpeed;
    }
  } else {
    delete entity._groundStartFrame;
    if (entity === player) {
      if (input.left) { entity.vx -= PHYS.airAccel; entity.facing = -1; }
      if (input.right) { entity.vx += PHYS.airAccel; entity.facing = 1; }
    }
    entity.vx *= PHYS.airFriction;
    if (Math.abs(entity.vx) > PHYS.airMaxSpeed) {
      entity.vx = Math.sign(entity.vx) * PHYS.airMaxSpeed;
    }
  }

  if (Math.abs(entity.vx) < 0.05) entity.vx = 0;

  entity.x += entity.vx;
  entity.y += entity.vy;

  // 屏幕环绕（敌人X轴适用）+ 边界约束（所有实体不可飞出屏幕）
  // 上方边界：所有实体不可飞出
  if (entity.y < 0) { entity.y = 0; if (entity.vy < 0) entity.vy = 0; }

  if (entity === player) {
    // 玩家：左右边界硬约束，不穿越
    if (entity.x < 0) { entity.x = 0; if (entity.vx < 0) entity.vx = 0; }
    if (entity.x + entity.w > GAME_W) { entity.x = GAME_W - entity.w; if (entity.vx > 0) entity.vx = 0; }
  } else {
    // 敌人：左右环绕
    if (entity.x + entity.w < 0) entity.x = GAME_W;
    if (entity.x > GAME_W) entity.x = -entity.w;
  }

  const wasOnGround = entity.onGround;
  platformCollision(entity);
  if (!wasOnGround && entity.onGround && entity === player) {
    playSound('land');
    spawnBounceParticles(entity.x + 10, entity.y + entity.h);
  }

  // 水面检测
  if (entity.y + entity.h > WATER_Y + 20) {
    if (entity === player) {
      if (entity.alive) {
        entity.alive = false;
        entity.deathCount++;
        entity.respawnsLeft--;
        player.score = Math.max(0, player.score - 300);
        playSound('splash');
        addScreenShake(8);
        spawnPopParticles(entity.x + 10, WATER_Y, '#4af');
        startRespawn();
      }
    } else {
      if (entity.alive) {
        entity.alive = false;
        entity.respawnTimer = 120;
        player.score += 500;
        playSound('splash');
        spawnPopParticles(entity.x + 10, WATER_Y, '#4af');
      }
    }
  }

  if (Math.abs(entity.vx) > 0.3) {
    entity.walkFrame += 0.1;
  } else {
    entity.walkFrame = 0;
  }
  if (!entity.onGround) {
    entity.flapFrame += 0.15;
  }
}

// ---------- 拍打 ----------
function doFlap(entity) {
  if (entity.balloons <= 0) return;
  if (entity.flapCooldown > 0) return;

  const impulse = getFlapImpulse(entity.balloons);
  if (entity.vy > 0 || entity.onGround) {
    entity.vy = impulse;
  } else {
    entity.vy += impulse * 0.4;
    if (entity.vy < impulse * 1.2) entity.vy = impulse * 1.2;
  }
  entity.flapCooldown = PHYS.flapCooldown;
  entity.flapFrame = 0;
  if (entity === player) playSound('flap');
}

// ---------- 踩踏检测 ----------
function checkStomps() {
  if (!player.alive || player.invincible > 0) return;

  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    if (!boxOverlap(player, enemy)) continue;

    const playerCenterY = player.y + player.h / 2;
    const enemyCenterY = enemy.y + enemy.h / 2;

    // ── 踢杀：有气球的人踩 0 气球且在地面的对手 → 直接击杀 ──
    if (enemy.balloons <= 0 && enemy.onGround && player.balloons > 0 && player.vy > 0) {
      if (enemy.invincible > 0) continue;
      enemy.alive = false;
      enemy.respawnTimer = 180;
      player.vy = getFlapImpulse(player.balloons) * 0.8;
      player.stompChain++;
      player.stompTimer = 60;
      player.score += 300;
      playSound('stomp');
      spawnPopParticles(enemy.x + 10, enemy.y, '#f00');
      spawnPopParticles(enemy.x + 10, enemy.y, '#ff0');
      addScreenShake(6);
      continue;
    }
    // 敌人踢杀玩家
    if (player.balloons <= 0 && player.onGround && enemy.balloons > 0 && enemy.vy > 0) {
      player.alive = false;
      player.deathCount++;
      player.respawnsLeft--;
      player.score = Math.max(0, player.score - 300);
      playSound('splash');
      addScreenShake(8);
      spawnPopParticles(player.x + 10, player.y, '#f00');
      startRespawn();
      continue;
    }

    // ── 标准踩踏判定 ──
    if (playerCenterY < enemyCenterY && player.vy > 0 && enemy.invincible <= 0) {
      // 玩家从上方踩踏敌人
      if (enemy.balloons > 0) {
        popBalloon(enemy);
        gainBalloon(player);  // 戳破气球 +1
      }
      player.vy = getFlapImpulse(player.balloons) * 0.8;
      player.stompChain++;
      player.stompTimer = 60;
      const bonus = [200, 300, 400, 500][Math.min(player.stompChain - 1, 3)];
      player.score += bonus;
      playSound('stomp');
      spawnBounceParticles(enemy.x + 10, enemy.y);
    } else if (enemyCenterY < playerCenterY && enemy.vy > 0) {
      // 敌人从上方踩踏玩家
      if (player.balloons > 0) {
        popBalloon(player);
        gainBalloon(enemy);  // 敌人也获得 +1
      }
      enemy.vy = getFlapImpulse(enemy.balloons) * 0.8;
      player.invincible = 60;
      playSound('pop');
    } else {
      // 侧面碰撞：双方都未无敌时才爆，爆完双方都加无敌防连爆
      if (player.invincible <= 0 && enemy.invincible <= 0) {
        if (player.balloons > 0) popBalloon(player);
        if (enemy.balloons > 0) {
          popBalloon(enemy);
          gainBalloon(player);
        }
        player.invincible = 90;
        enemy.invincible = 90;
        playSound('pop');
      }
    }
  }
}

// ── 获得气球（上限 5）──
function gainBalloon(entity) {
  if (entity.balloons < PHYS.maxBalloons) {
    entity.balloons++;
    entity.groundedZeroTimer = 0;
    entity.inflatePhase = 0;
    entity.inflateTimer = 0;
  }
}

function popBalloon(entity) {
  if (entity.balloons <= 0) return;
  entity.balloons--;

  const bounceForce = entity.balloons >= 1 ? -1.5 : -0.5;
  entity.vy = Math.min(entity.vy, bounceForce);

  const popX = entity.x + entity.w / 2;
  const popY = entity.y - 5;
  const color = entity === player ? '#4bf' : entity.color;
  spawnPopParticles(popX, popY, color);
  spawnPopParticles(popX, popY, '#fff');

  if (entity === player) {
    addScreenShake(5);
    playSound('pop');
  }

  if (entity.balloons === 1) {
    entity.vy += 0.5;
  }
}

// ---------- 气球回充 ----------
function updateRecharge(dt) {
  if (player.onGround && platforms.some(p => p.isMain &&
      player.x + player.w > p.x && player.x < p.x + p.w &&
      Math.abs(player.y + player.h - p.y) < 2)) {
    player.rechargeTimer += dt;
    if (player.rechargeTimer >= PHYS.rechargeTime / 2 && player.balloons < 2) {
      player.balloons = Math.min(player.balloons + 1, 2);
      playSound('land');
    }
  } else {
    player.rechargeTimer = 0;
  }
}

// ---------- 平台导航 AI ----------
function findBestPlatform(entity) {
  // 找到实体最近的、在头顶上方的平台
  let best = null;
  let bestDist = Infinity;
  const ex = entity.x + entity.w / 2;
  const ey = entity.y + entity.h;

  for (const plat of platforms) {
    const px = plat.x + plat.w / 2;
    const py = plat.y;
    // 平台必须在实体上方（或接近同高度）
    if (py > ey + 10) continue;
    const dist = Math.abs(px - ex) + Math.abs(py - ey) * 0.5;
    if (dist < bestDist) {
      bestDist = dist;
      best = plat;
    }
  }
  return best;
}

function navigateToPlatform(entity, target) {
  if (!target) return;
  const ex = entity.x + entity.w / 2;
  const tx = target.x + target.w / 2;
  const dx = tx - ex;

  // 水平移动向平台
  entity.targetVx = Math.sign(dx) * Math.min(Math.abs(dx) * 0.03, 2.0);

  // 如果在平台下方，需要频繁拍翅膀飞上去
  if (entity.y + entity.h > target.y + 15) {
    entity.flapTimer = 0; // 立即拍翅膀
  }
}

// ---------- 敌人 AI ----------

function updateEnemyAI(enemy, dt) {
  if (!enemy.alive) {
    enemy.respawnTimer--;
    if (enemy.respawnTimer <= 0) {
      enemy.alive = true;
      enemy.balloons = enemy.color === '#4a4' ? 3 : (enemy.aiLevel >= 3 ? 3 : 2);
      enemy.maxBalloons = enemy.balloons;
      enemy.groundedZeroTimer = 0;
      enemy.inflatePhase = 0;
      enemy.inflateTimer = 0;
      // 固定复活点
      switch (enemy.color) {
        case '#f33': enemy.x = 230; enemy.y = 30; break;   // 红色：正中央上方
        case '#f84': enemy.x = 60; enemy.y = 210; break;   // 橙色：左侧
        case '#4a4': enemy.x = 350; enemy.y = 210; break;  // 绿色：右侧
        case '#48f': enemy.x = 240; enemy.y = 260; break;  // 蓝色：中间平台
        default: enemy.x = 240; enemy.y = 150;
      }
      enemy.vx = 0;
      enemy.vy = 0;
      enemy.invincible = 60; // 重生后短暂无敌
    }
    return;
  }

  // ── 0 气球：地面行走 → 等待 → 充气 → 飞起 ──
  if (enemy.balloons <= 0) {
    if (enemy.onGround) {
      enemy.groundedZeroTimer += dt;

      // 充气阶段：正在膨胀气球
      if (enemy.inflatePhase === 1) {
        enemy.inflateTimer += dt;
        enemy.vx *= 0.9;
        if (enemy.inflateTimer >= 400) { // 从 500 缩短到 400，恢复更快
          enemy.inflatePhase = 0;
          enemy.inflateTimer = 0;
          enemy.groundedZeroTimer = 0;
          enemy.balloons = 1;
        }
        return;
      }

      // 等待阶段：0.8秒后开始充气（从 1.5s 缩短）
      if (enemy.groundedZeroTimer >= 800) {
        enemy.inflatePhase = 1;
        enemy.inflateTimer = 0;
        return;
      }

      // 地面行走：向最近平台方向移动（确保不在危险位置）
      const targetPlat = findBestPlatform(enemy);
      if (targetPlat) {
        navigateToPlatform(enemy, targetPlat);
      } else {
        // 没有合适平台，向玩家方向缓慢移动
        if (enemy.thinkTimer-- <= 0) {
          enemy.thinkTimer = 20 + Math.random() * 30;
          const dx = player.x - enemy.x;
          enemy.targetVx = Math.sign(dx) * 1.0;
        }
      }
      enemy.vx += (enemy.targetVx - enemy.vx) * 0.08;
    }
    // 掉到水面附近也直接死
    if (enemy.y + enemy.h > WATER_Y - 10) {
      enemy.alive = false;
      enemy.respawnTimer = 90;
      player.score += 200;
      spawnPopParticles(enemy.x + 10, WATER_Y, enemy.color);
      return;
    }
    updatePhysics(enemy, dt);
    return;
  }

  // ── 正常 AI（有气球）：追击玩家 + 主动回平台 ──

  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;

  enemy.thinkTimer--;
  if (enemy.thinkTimer <= 0) {
    enemy.thinkTimer = 15 + Math.random() * 30;

    // 如果在低处（y > 200），优先飞向高平台
    if (enemy.y > 200) {
      const targetPlat = findBestPlatform(enemy);
      if (targetPlat) {
        navigateToPlatform(enemy, targetPlat);
      } else {
        enemy.targetVx = Math.sign(dx) * 1.5;
        if (dy < -30) enemy.flapTimer = 0;
      }
    } else {
      // 在高处：向玩家追击
      if (enemy.aiLevel >= 3) {
        // 红色暴躁：疯狂追击
        enemy.targetVx = Math.sign(dx) * 2.5;
        if (dy < -10) enemy.flapTimer = 0;
        enemy.thinkTimer = 8 + Math.random() * 8;
      } else if (enemy.aiLevel >= 2) {
        // 橙色/蓝色：中等追击
        enemy.targetVx = Math.sign(dx) * (1.5 + enemy.aiLevel * 0.4);
        if (dy < -30) enemy.flapTimer = 0;
      } else {
        // 绿色：缓慢追击
        enemy.targetVx = Math.sign(dx) * 1.2;
        if (dy < -40) enemy.flapTimer = 0;
      }
    }
  }

  enemy.vx += (enemy.targetVx - enemy.vx) * 0.06;

  // 拍翅膀：低处更频繁
  enemy.flapTimer--;
  if (enemy.flapTimer <= 0) {
    let flapInterval;
    if (enemy.y > 200) {
      // 在低处：频繁拍翅膀，尽快飞上去
      flapInterval = 6 + Math.random() * 6;
    } else if (enemy.aiLevel >= 3) {
      flapInterval = 8 + Math.random() * 8;
    } else if (enemy.balloons >= 2) {
      flapInterval = 30 + Math.random() * 20;
    } else {
      flapInterval = 15 + Math.random() * 15;
    }
    enemy.flapTimer = flapInterval;
    doFlap(enemy);
  }

  updatePhysics(enemy, dt);
}

// ---------- 绘制 ----------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, WATER_Y * scale);
  grad.addColorStop(0, '#0a0a2e');
  grad.addColorStop(1, '#1a1a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GAME_W * scale, WATER_Y * scale);

  ctx.fillStyle = '#fff';
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 137 + 50) % GAME_W) * scale;
    const sy = ((i * 89 + 30) % (WATER_Y - 40)) * scale;
    const blink = Math.sin(Date.now() * 0.003 + i) * 0.5 + 0.5;
    ctx.globalAlpha = 0.3 + blink * 0.7;
    ctx.fillRect(sx, sy, scale, scale);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1a3a6a';
  ctx.fillRect(0, WATER_Y * scale, GAME_W * scale, (GAME_H - WATER_Y) * scale);
  ctx.strokeStyle = '#2a5a9a';
  ctx.lineWidth = scale;
  ctx.beginPath();
  for (let x = 0; x < GAME_W; x += 2) {
    const wy = WATER_Y + Math.sin((x + Date.now() * 0.002) * 0.05) * 3;
    if (x === 0) ctx.moveTo(x * scale, wy * scale);
    else ctx.lineTo(x * scale, wy * scale);
  }
  ctx.stroke();
}

function drawPlatforms() {
  for (const p of platforms) {
    ctx.fillStyle = p.color;
    const r = p.isMain ? 4 : 3;
    ctx.fillRect((p.x + r) * scale, p.y * scale, (p.w - r * 2) * scale, p.h * scale);
    ctx.fillRect(p.x * scale, (p.y + r) * scale, r * scale, (p.h - r * 2) * scale);
    ctx.fillRect((p.x + p.w - r) * scale, (p.y + r) * scale, r * scale, (p.h - r * 2) * scale);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect((p.x + 2) * scale, p.y * scale, (p.w - 4) * scale, 2 * scale);
    if (p.isMain) {
      ctx.fillStyle = 'rgba(100,255,180,0.3)';
      ctx.fillRect((p.x + 4) * scale, (p.y + p.h) * scale, (p.w - 8) * scale, 3 * scale);
    }
  }
}

function drawBalloon(x, y, color, bobOffset, balloonScale) {
  const s = balloonScale || 1;
  const bx = x * scale;
  const by = (y + bobOffset) * scale;
  const r = 6 * scale * s;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(bx, by, r, r * 1.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(bx - r * 0.3, by - r * 0.3, r * 0.3, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = scale;
  ctx.beginPath();
  ctx.moveTo(bx, by + r * 1.2);
  ctx.lineTo(x * scale, (y + 14) * scale);
  ctx.stroke();
}

function drawCharacter(entity) {
  if (!entity.alive) return;
  const s = scale;
  const es = entity.scale || 1; // 实体缩放（绿巨人=1.5）
  const x = entity.x;
  const y = entity.y;
  const isPlayer = entity === player;
  const bodyColor = isPlayer ? '#fff' : '#ddd';
  const facing = entity.facing;

  // 无敌闪烁
  if (entity.invincible > 0 && Math.floor(entity.invincible / 4) % 2) {
    ctx.globalAlpha = 0.4;
  }

  // 气球（最多3个）
  const balloonY = y - 14 * es;
  const bob = Math.sin(Date.now() * 0.004 + entity.x) * 2;
  const bColor = isPlayer ? '#4bf' : entity.color;

  // 充气动画：正在膨胀一个新气球
  if (!isPlayer && entity.inflatePhase === 1) {
    const progress = Math.min(entity.inflateTimer / 500, 1);
    const bs = 0.2 + progress * 0.8; // 从 0.2 缩放到 1.0
    const inflateBob = Math.sin(Date.now() * 0.008) * 1;
    drawBalloon(x + 10 * es, y - 8 * es, bColor, inflateBob, bs);
  }

  if (entity.balloons >= 3) {
    drawBalloon(x + 2 * es, balloonY, bColor, bob);
    drawBalloon(x + 10 * es, balloonY, bColor, -bob);
    drawBalloon(x + 18 * es, balloonY, bColor, bob * 0.5);
  } else if (entity.balloons >= 2) {
    drawBalloon(x + 5 * es, balloonY, bColor, bob);
    drawBalloon(x + 15 * es, balloonY, bColor, -bob);
  } else if (entity.balloons === 1) {
    drawBalloon(x + 10 * es, balloonY, bColor, bob);
  }

  // 身体（缩放绘制）
  const bw = 8 * es, bh = 8 * es, sw = 10 * es, sh = 10 * es;
  const walkBob = entity.onGround ? Math.sin(entity.walkFrame * 2) * 1 : 0;
  ctx.fillStyle = bodyColor;
  ctx.fillRect((x + 6) * s, (y + 2 + walkBob) * s, bw * s, bh * s); // 头
  ctx.fillRect((x + 5) * s, (y + 10 + walkBob) * s, sw * s, sh * s); // 身体

  // 眼睛
  ctx.fillStyle = '#000';
  const eyeX = facing > 0 ? x + 11 * es : x + 7 * es;
  ctx.fillRect(eyeX * s, (y + 4 + walkBob) * s, 2 * es * s, 2 * es * s);

  // 腿
  ctx.fillStyle = isPlayer ? '#eee' : '#ccc';
  if (entity.onGround && Math.abs(entity.vx) > 0.3) {
    const legOff = Math.sin(entity.walkFrame * 4) * 3;
    ctx.fillRect((x + 6) * s, (y + 20 + walkBob) * s, 3 * es * s, 4 * es * s);
    ctx.fillRect((x + 11 + legOff) * s, (y + 20 + walkBob) * s, 3 * es * s, 4 * es * s);
  } else {
    ctx.fillRect((x + 6) * s, (y + 20) * s, 3 * es * s, 4 * es * s);
    ctx.fillRect((x + 11) * s, (y + 20) * s, 3 * es * s, 4 * es * s);
  }

  ctx.fillStyle = isPlayer ? '#adf' : entity.color;
  const wingAngle = !entity.onGround ? Math.sin(entity.flapFrame * 3) * 15 : 0;
  ctx.save();
  ctx.translate((x + 5) * s, (y + 12) * s);
  ctx.rotate((-20 - wingAngle) * Math.PI / 180);
  ctx.fillRect(-6 * es * s, -2 * es * s, 6 * es * s, 4 * es * s);
  ctx.restore();
  ctx.save();
  ctx.translate((x + 15) * s, (y + 12) * s);
  ctx.rotate((20 + wingAngle) * Math.PI / 180);
  ctx.fillRect(0, -2 * es * s, 6 * es * s, 4 * es * s);
  ctx.restore();

  ctx.globalAlpha = 1;
}

function drawDebugInfo() {
  // 气球显示（最多 5 个）
  const balloonStr = '🎈'.repeat(player.balloons) + '·'.repeat(PHYS.maxBalloons - player.balloons);
  document.getElementById('hudBalloon').textContent = balloonStr;
  document.getElementById('hudState').textContent =
    player.alive ? (
      player.balloons >= 3 ? '强力' :
      player.balloons >= 2 ? '浮空' :
      player.balloons === 1 ? '吃力' :
      player.onGround ? '步行中' : '坠落！'
    ) : (player.respawnsLeft > 0 ? '阵亡' : '💀 游戏结束');
  document.getElementById('hudScore').textContent = `${player.score} 分`;
  document.getElementById('hudDeaths').textContent = `❤️ ${player.respawnsLeft}`;

  // 同步控制栏信息
  document.getElementById('balloon-icon').textContent = balloonStr;
  document.getElementById('score-text').textContent = player.score;

  // 速度矢量可视化
  const cx = (player.x + player.w / 2) * scale;
  const cy = (player.y + player.h / 2) * scale;
  ctx.strokeStyle = 'rgba(255,100,100,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + player.vx * 10 * scale, cy + player.vy * 10 * scale);
  ctx.stroke();

  if (player.stompTimer > 0 && player.stompChain > 1) {
    ctx.fillStyle = '#ff0';
    ctx.font = `bold ${16 * scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`×${player.stompChain} COMBO!`, (player.x + 10) * scale, (player.y - 20) * scale);
  }
}

// ---------- 重生系统 ----------
function startRespawn() {
  // 命用完 → Game Over
  if (player.respawnsLeft <= 0) {
    respawnState.active = true;
    respawnState.timer = 99999;
    respawnState.tick = -1;
    respawnState.gameOver = true;
    const overlay = document.getElementById('respawn-overlay');
    overlay.style.display = 'flex';
    document.getElementById('respawn-countdown').textContent = '💀';
    document.getElementById('respawn-text').textContent =
      `游戏结束！得分：${player.score} · 点击「🔄 重来」重新开始`;
    return;
  }
  // 正常重生
  respawnState.active = true;
  respawnState.timer = 3000;
  respawnState.tick = 3;
  respawnState.gameOver = false;
  const overlay = document.getElementById('respawn-overlay');
  overlay.style.display = 'flex';
  document.getElementById('respawn-countdown').textContent = '3';
  document.getElementById('respawn-text').textContent =
    `被击败了！剩余 ${player.respawnsLeft} 条命 · 即将重生...`;
}

function updateRespawn(dt) {
  if (!respawnState.active) return;
  if (respawnState.gameOver) return;  // Game Over 等待玩家手动重置

  respawnState.timer -= dt;
  const newTick = Math.ceil(respawnState.timer / 1000);
  if (newTick !== respawnState.tick && newTick > 0) {
    respawnState.tick = newTick;
    document.getElementById('respawn-countdown').textContent = String(newTick);
  }
  if (respawnState.timer <= 0) {
    respawnState.active = false;
    document.getElementById('respawn-overlay').style.display = 'none';
    player.alive = true;
    player.balloons = 2;
    player.vx = 0;
    player.vy = 0;
    player.invincible = 120;
    // 复活在中间大平台上方
    player.x = 220 + Math.random() * 40;
    player.y = 260;
    player.rechargeTimer = 0;
    player.flapCooldown = 0;
    player.stompChain = 0;
    player.stompTimer = 0;
    playSound('land');
  }
}

// ---------- 主循环 ----------
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTime, 33);
  lastTime = timestamp;

  updateScreenShake();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  if (screenShake > 0) {
    ctx.translate(screenShakeX * scale, screenShakeY * scale);
  }

  drawBackground();
  drawPlatforms();

  if (player.alive) {
    if (player.invincible > 0) player.invincible--;
    if (player.stompTimer > 0) {
      player.stompTimer--;
      if (player.stompTimer <= 0) player.stompChain = 0;
    }

    if (input.flapJustPressed || (input.flap && player.flapCooldown <= 0)) {
      doFlap(player);
      input.flapJustPressed = false;
    }

    updatePhysics(player, dt);
    updateRecharge(dt);
    checkStomps();

    if (player.balloons <= 0 && player.onGround) {
      const mainPlat = platforms.find(p => p.isMain);
      const onMain = mainPlat && player.x + player.w > mainPlat.x &&
                     player.x < mainPlat.x + mainPlat.w &&
                     Math.abs(player.y + player.h - mainPlat.y) < 3;
      if (!onMain && player.vy >= 0) {
        player.alive = false;
        player.deathCount++;
        player.respawnsLeft--;
        player.score = Math.max(0, player.score - 300);
        playSound('pop');
        addScreenShake(5);
        spawnPopParticles(player.x + 10, player.y, '#4bf');
        startRespawn();
      }
    }
  }

  for (const enemy of enemies) {
    if (enemy.invincible > 0) enemy.invincible--;
    updateEnemyAI(enemy, dt);
  }

  updateRespawn(dt);
  updateParticles();

  for (const enemy of enemies) drawCharacter(enemy);
  drawCharacter(player);
  drawParticles();
  drawDebugInfo();

  ctx.fillStyle = 'rgba(10,30,80,0.3)';
  ctx.fillRect(0, WATER_Y * scale, GAME_W * scale, (GAME_H - WATER_Y) * scale);

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// 虚拟按键系统（核心改动！）
// ============================================================

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnFlap = document.getElementById('flap-btn');
const btnReset = document.getElementById('btn-reset');

// 工具函数：阻止默认行为 + 阻止事件冒泡到 canvas
function eat(e) {
  e.preventDefault();
  e.stopPropagation();
}

// ── 左键 ──
btnLeft.addEventListener('touchstart', (e) => {
  eat(e); initAudio();
  input.left = true;
  btnLeft.classList.add('active');
}, { passive: false });
btnLeft.addEventListener('touchend', (e) => {
  eat(e);
  input.left = false;
  btnLeft.classList.remove('active');
}, { passive: false });
btnLeft.addEventListener('touchcancel', (e) => {
  eat(e);
  input.left = false;
  btnLeft.classList.remove('active');
}, { passive: false });

// ── 右键 ──
btnRight.addEventListener('touchstart', (e) => {
  eat(e); initAudio();
  input.right = true;
  btnRight.classList.add('active');
}, { passive: false });
btnRight.addEventListener('touchend', (e) => {
  eat(e);
  input.right = false;
  btnRight.classList.remove('active');
}, { passive: false });
btnRight.addEventListener('touchcancel', (e) => {
  eat(e);
  input.right = false;
  btnRight.classList.remove('active');
}, { passive: false });

// ── 拍打按钮（支持长按连拍）──
btnFlap.addEventListener('touchstart', (e) => {
  eat(e); initAudio();
  input.flapJustPressed = true;
  input.flap = true;
  btnFlap.classList.add('active');
}, { passive: false });
btnFlap.addEventListener('touchend', (e) => {
  eat(e);
  input.flap = false;
  btnFlap.classList.remove('active');
}, { passive: false });
btnFlap.addEventListener('touchcancel', (e) => {
  eat(e);
  input.flap = false;
  btnFlap.classList.remove('active');
}, { passive: false });

// ── 重置按钮 ──
btnReset.addEventListener('click', (e) => {
  eat(e);
  resetGame();
});
btnReset.addEventListener('touchstart', (e) => {
  eat(e);
}, { passive: false });

// ── 鼠标回退（桌面端）──
[btnLeft, btnRight, btnFlap].forEach(btn => {
  btn.addEventListener('mousedown', () => { initAudio(); });
});

// ── 键盘保留（桌面调试用）──
document.addEventListener('keydown', (e) => {
  initAudio();
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': input.left = true; break;
    case 'ArrowRight': case 'KeyD': input.right = true; break;
    case 'Space': case 'ArrowUp': case 'KeyW':
      e.preventDefault();
      input.flapJustPressed = true;
      input.flap = true;
      break;
    case 'KeyR': resetGame(); break;
  }
});
document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': input.left = false; break;
    case 'ArrowRight': case 'KeyD': input.right = false; break;
    case 'Space': case 'ArrowUp': case 'KeyW': input.flap = false; break;
  }
});

// ── Canvas 触摸：点击 = 拍打（兼容旧习惯）──
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  input.flapJustPressed = true;
}, { passive: false });

// ── 鼠标点击 canvas = 拍打 ──
canvas.addEventListener('mousedown', () => {
  initAudio();
  input.flapJustPressed = true;
});

// ---------- 重置 ----------
function resetGame() {
  player.x = 240;
  player.y = 150;
  player.vx = 0;
  player.vy = 0;
  player.balloons = 2;
  player.alive = true;
  player.rechargeTimer = 0;
  player.invincible = 0;
  player.stompChain = 0;
  player.stompTimer = 0;
  player.deathCount = 0;
  player.respawnsLeft = 10;  // 重置 10 条命
  player.score = 0;
  resetEnemies();
  particles.length = 0;
  respawnState.active = false;
  respawnState.timer = 0;
  respawnState.gameOver = false;
  document.getElementById('respawn-overlay').style.display = 'none';
}

// ---------- 启动 ----------
resetGame();
requestAnimationFrame(gameLoop);
</script>
