<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>气球大乱踩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 虚拟按键 */
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.6);
      gap: 8px;
    }

    .ctrl-group {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .ctrl-btn:active, .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.3);
    }

    #btn-flap {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border-color: rgba(100, 200, 255, 0.5);
      background: rgba(100, 200, 255, 0.15);
      font-size: 14px;
      font-weight: bold;
    }

    #btn-flap:active, #btn-flap.active {
      background: rgba(100, 200, 255, 0.4);
    }

    /* 横屏适配 */
    @media (orientation: landscape) {
      #game-container {
        flex-direction: row;
      }
      #controls {
        flex-direction: column;
        width: 80px;
        height: 100%;
        padding: 8px;
        padding-right: max(8px, env(safe-area-inset-right));
        justify-content: flex-end;
        align-items: center;
      }
      .ctrl-group {
        flex-direction: column;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DLG6IiqW.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="controls">
      <div class="ctrl-group">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>
      <button class="ctrl-btn" id="btn-flap">A</button>
    </div>
  </div>

</body>
</html>
